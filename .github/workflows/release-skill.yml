name: Release Agent Skill

on:
  push:
    tags:
      - "skills-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          node -e 'const release=require("./scripts/skills/release.json"); if (release.version !== process.env.GITHUB_REF_NAME) { throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${release.version}`); }'

      - name: Validate and package
        run: |
          pnpm skills:validate
          pnpm skills:package
          pnpm skills:test

      - name: Publish reviewed assets
        uses: softprops/action-gh-release@v2
        with:
          name: Gigatable Agent Skill ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/skills/gigatable-skill.zip
            dist/skills/install-gigatable-skill.sh
            dist/skills/install-gigatable-skill.ps1
            dist/skills/SHA256SUMS
